[project]
name = "rag-end-to-end"
version = "0.1.0"
description = "End-to-end RAG app: FastAPI backend, Chroma vector store, simple HTML frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
